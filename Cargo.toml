[package]
name = "peds-calc-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
yew = { version = "0.21.0", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "HtmlInputElement",
  "Window",
  "Document",
  "EventTarget",
  "Element",
  "NodeList",
  "HtmlElement"
] }
